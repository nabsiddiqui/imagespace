[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imagespace"
version = "1.2.0"
description = "Transform a folder of images into an interactive 2D scatter-plot visualization (CLIP + t-SNE + HDBSCAN). Static-site output, no backend required."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nabeel Siddiqui" }]
keywords = ["image", "visualization", "clip", "tsne", "hdbscan", "digital-humanities"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: Web Environment",
]
# Lower bounds are the oldest versions the test suite runs against (see
# constraints-min.txt and .github/workflows/ci.yml). They are deliberately
# broad so ImageSpace keeps working as the scientific-Python stack moves.
dependencies = [
    "pillow>=9.5",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "opentsne>=1.0",
    "hdbscan>=0.8.40",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Recommended: ONNX CLIP embeddings (fast, GPU-accelerated on Apple Silicon/CUDA).
onnx = ["onnxruntime>=1.15"]
# Fallback: torch + transformers CLIP backend (slower, no ONNX runtime needed).
torch = ["torch>=2.0", "transformers>=4.30", "huggingface_hub>=0.16"]
# Everything needed for embeddings plus aligned text-based cluster labels.
full = ["onnxruntime>=1.15", "huggingface_hub>=0.16", "torch>=2.0", "transformers>=4.30"]
# Test suite (network-free numeric checks). The full end-to-end contract in
# tests/run_checks.py additionally needs the `full` extra plus Node.js.
test = ["pytest>=7.0"]

[project.scripts]
imagespace = "imagespace:main"

[tool.setuptools]
# `imagespace` is a single-file module at scripts/imagespace.py. The companion
# packages hold the bundled viewer shell and versioned analysis resources.
py-modules = ["imagespace"]
packages = ["imagespace_viewer_shell", "imagespace_resources"]

[tool.setuptools.package-dir]
# Top-level modules (imagespace) are looked up under scripts/.
"" = "scripts"
# The viewer-shell data package lives at the repo root.
imagespace_viewer_shell = "imagespace_viewer_shell"
imagespace_resources = "imagespace_resources"

[tool.setuptools.package-data]
# Bundle the data-free viewer app shell with the installed package so the
# pipeline can emit a self-contained static site without a separate Vite build.
imagespace_viewer_shell = ["viewer_shell/**/*"]
imagespace_resources = ["label_presets/*.json"]
[tool.pytest.ini_options]
# Network-free numeric suite. The heavy end-to-end contract lives in
# tests/run_checks.py and is run separately (it needs models + Node.js).
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
