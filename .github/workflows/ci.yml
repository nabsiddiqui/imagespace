name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-version robustness evidence: the numeric pipeline (PCA, t-SNE,
  # HDBSCAN, k-NN, feature extraction, binary/CSV writers) must keep working
  # across Python versions and across the scientific-Python dependency stack.
  # These tests are network-free (no model downloads), so they run fast.
  python-tests:
    name: python ${{ matrix.python-version }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        deps: [latest]
        include:
          # Oldest supported dependency set, pinned in constraints-min.txt.
          - python-version: "3.10"
            deps: minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (latest dependencies)
        if: matrix.deps == 'latest'
        run: python -m pip install --upgrade pip && pip install ".[test]"
      - name: Install (minimum dependencies)
        if: matrix.deps == 'minimum'
        run: python -m pip install --upgrade pip && pip install -c constraints-min.txt ".[test]"
      - name: Report resolved versions
        run: pip list
      - name: Run network-free numeric test suite
        run: pytest

  # The viewer must keep building. Deterministic, no network model downloads.
  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image_space
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: image_space/package-lock.json
      - run: npm ci
      - run: npm run build
